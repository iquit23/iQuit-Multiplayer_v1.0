<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="I QUIT!">
  <!-- Favicon από το ΥΠΑΡΧΟΝ wordmark του παιχνιδιού («I QUIT» + μπλε θαυμαστικό).
       Χρώματα από την παλέτα του UI: φόντο #0e1726, accent #3b82f6, κείμενο #eaf1fb.
       Δεν είναι νέο brand: είναι το logo της αρχικής σε μορφή αρχείου, ώστε να
       μπορεί να το κατεβάσει η Google (τα data: URI favicons δεν γίνονται fetch).
       ΠΡΟΣΟΧΗ: σε XML σχόλια απαγορεύεται η ακολουθία δύο παυλών. -->
  <rect width="64" height="64" rx="14" fill="#0e1726"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#2b3f63" stroke-width="3"/>
  <text x="30" y="44.5" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="30" font-weight="900" letter-spacing="0.5" fill="#eaf1fb">IQ</text>
  <text x="52" y="44.5" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="30" font-weight="900" fill="#3b82f6">!</text>
</svg>
